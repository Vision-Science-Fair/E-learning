<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - LearnNest</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .hidden {
            display: none; 
        }
        .quiz-card { 
            margin: 1rem auto; 
            max-width: 820px; 
            background: rgba(15, 23, 42, 0.85); 
            padding: 1rem 1.3rem; 
            border-radius: 14px; 
            border: 1px solid rgba(56,189,248,0.28); 
        }
        .quiz-card h2 { 
            margin-bottom: 0.8rem; 
            color: #dbeafe; 
        }
        .question-block { 
            margin-bottom: 1rem; 
            padding: 0.8rem 1rem; 
            background: rgba(32, 40, 68, 0.7); 
            border-radius: 10px; 
        }
        .question-block p { 
            margin-bottom: 0.4rem; 
        }
        .question-block label { 
            display: block; 
            margin-bottom: 0.3rem; 
            cursor: pointer; 
        }
        .message { 
            margin-top: 1rem; 
            padding: 0.8rem; 
            border-radius: 10px; 
            font-weight: 600; 
        }
        .message.success { 
            background: rgba(34,197,94,0.2); 
            border: 1px solid rgba(34,197,94,0.5); 
            color: #bbf7d0; 
        }
        .message.warn { 
            background: rgba(245,158,11,0.2); 
            border: 1px solid rgba(245,158,11,0.5); 
            color: #fde68a; 
        }
        .controls { 
            margin-top: 1rem; 
            display: flex; 
            gap: 0.7rem; 
            flex-wrap: wrap; 
        }
        .controls button { 
            padding: 0.6rem 1rem; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 600; 
            color: #fff; 
            background: #0ea5e9; 
        }
        .controls button.secondary { 
            background: #475569; 
        }

        .popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .popup-card {
            width: min(90vw, 550px);
            background: rgba(10, 16, 29, 0.96);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 14px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            padding: 1rem 1.2rem;
            color: #eaf6ff;
            position: relative;
        }

        .popup-card h3 { 
            margin: 0 0 0.75rem; 
        }
        .popup-card pre { 
            background: rgba(15, 23, 42, 0.85); 
            padding: 0.75rem; 
            border-radius: 10px; 
            overflow-x: auto; 
        }

        .popup-close {
            position: absolute;
            right: 0.9rem;
            top: 0.75rem;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
        }

        .popup-hidden { 
            display: none; 
        }
        .main-title{
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(90deg, #38bdf8, #e0f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .footer {
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid rgba(56,189,248,0.35);
            box-shadow: 0 -8px 30px rgba(0,0,0,0.5);
            padding: 28px 10%;
            text-align: center;
            margin-top: auto;
        }
        .footer p {
            color: #bae6fd;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 22px;
            flex-wrap: wrap;
        }
        .footer a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            position: relative;
        }
        .footer a::after {
            content: "";
            position: absolute;
            width: 0%;
            height: 2px;
            bottom: -4px;
            left: 0;
            background: #38bdf8;
            transition: width 0.3s ease;
        }
        .footer a:hover::after {
            width: 100%;
        }
        .footer a:hover {
            color: #e0f7ff;
        }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="home.html">Home</a>
        <a href="grades.html">Grades</a>
        <a href="subjects.html">Subjects</a>
        <a href="quiz.html" class="active">Quizzes</a>
        <a href="BIT-Students\index.html">Tasks</a>
        <a href="about.html">About</a>
    </nav>

    <main class="container">
        <div class="main-title">
            <h1 id="page-title">Quiz</h1>
            <p id="subtitle" class="muted"></p>
        </div>
        <section id="quiz-selection" class="quiz-card">
            <h2>Select subject and grade</h2>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.9rem; align-items:center;">
                <div>
                  <label for="subject">Subject</label>
                  <select id="subject" style="width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:#0b1224;color:#eaf6ff;">
                    <option value="">Choose subject</option>
                    <option value="english">English</option>
                    <option value="amharic">Amharic</option>
                    <option value="mathematics">Mathematics</option>
                    <option value="general-science">General Science</option>
                    <option value="biology">Biology</option>
                    <option value="chemistry">Chemistry</option>
                    <option value="physics">Physics</option>
                    <option value="history">History</option>
                    <option value="geography">Geography</option>
                    <option value="economics">Economics</option>
                    <option value="citizenship">Citizenship</option>
                    <option value="social-studies">Social Studies</option>
                  </select>
                </div>
                <div>
                  <label for="grade">Grade</label>
                  <select id="grade" style="width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:#0b1224;color:#eaf6ff;">
                    <option value="">Choose grade</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                  </select>
                </div>
            </div>
            <div class="controls">
                <button id="start-quiz-btn">Load Quiz</button>
            </div>
        </section>

        <section id="quiz-content" class="quiz-card hidden"></section>
        <div id="quiz-result" class="message hidden"></div>
    </main>

    <div id="result-popup" class="popup-overlay popup-hidden" role="dialog" aria-modal="true">
        <div class="popup-card">
            <button id="popup-close" class="popup-close" aria-label="Close">×</button>
            <h3 id="popup-heading">Quiz Result</h3>
            <p id="popup-score" style="margin:0.3rem 0 0.9rem;"></p>
            <pre id="popup-details" style="margin:0"></pre>
            <div style="text-align:right; margin-top:0.8rem;"><button id="popup-ok" style="padding:0.45rem 0.9rem;border-radius:8px;border:none;cursor:pointer;background:#0ea5e9;color:#fff;">OK</button></div>
        </div>
    </div>
    <!--footer-->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2025 LearnNest. All rights reserved.</p>
            <div class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
                <a href="#">Contact</a>
            </div>
        </div>
    </footer>
    <script>
    function normalizeKey(s) {
        return s ? s.toString().toLowerCase().trim().replace(/\s+/g, '-').replace(/[^a-z0-9\-]/g, '') : '';
    }

    function capitalizeWords(str) {
        return str ? str.replace(/-/g, ' ').split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ') : '';
    }

    const params = new URLSearchParams(window.location.search);
    const preSubject = normalizeKey(params.get('subject'));
    const preGrade = normalizeKey(params.get('grade'));
    const pageTitle = document.getElementById('page-title');
    const subtitle = document.getElementById('subtitle');
    const quizSelection = document.getElementById('quiz-selection');
    const quizContent = document.getElementById('quiz-content');
    const quizResult = document.getElementById('quiz-result');
    const subjectSelect = document.getElementById('subject');
    const gradeSelect = document.getElementById('grade');

    const state = {subject: '', grade: '', questions: []};

    function setSelectionFromParams() {
        if (preSubject) subjectSelect.value = preSubject;
        if (preGrade) gradeSelect.value = preGrade;
        if (preSubject && preGrade) {
            loadQuiz(preSubject, preGrade);
        }
    }

    function renderQuestionList() {
        if (!state.questions.length) {
            quizContent.innerHTML = '<p class="muted">No quiz questions are available for this subject and grade yet.</p>';
            quizContent.classList.remove('hidden');
            quizResult.classList.add('hidden');
            return;
        }

        let html = `<h2>${capitalizeWords(state.subject)} - Grade ${state.grade} Quiz</h2>`;
        html += '<form id="quiz-form">';
        state.questions.forEach((q, index) => {
            const name = 'q' + index;
            html += `<div class="question-block"><p><strong>${index + 1}. ${q.question}</strong></p>`;
            q.options.forEach((option) => {
                const id = `${name}-${option.replace(/[^a-zA-Z0-9]/g, '')}-${Math.random().toString(36).slice(2,7)}`;
                html += `<label for="${id}"><input type="radio" name="${name}" id="${id}" value="${option}"> ${option}</label>`;
            });
            html += '</div>';
        });
        html += '<div class="controls"><button type="submit">Submit Answers</button><button type="button" class="secondary" id="clear-answers">Clear</button></div>';
        html += '</form>';

        quizContent.innerHTML = html;
        quizContent.classList.remove('hidden');
        quizResult.classList.add('hidden');

        const quizForm = document.getElementById('quiz-form');
        const clearBtn = document.getElementById('clear-answers');

        quizForm.addEventListener('submit', function(event) {
            event.preventDefault();
            evaluateQuiz();
        });

        clearBtn.onclick = function() {
            quizForm.reset();
            quizResult.classList.add('hidden');
        };
    }

    function evaluateQuiz() {
        const selected = state.questions.map((q, idx) => {
            const radio = document.querySelector(`input[name="q${idx}"]:checked`);
            return radio ? radio.value : null;
        });

        let score = 0;
        for (let i = 0; i < state.questions.length; i++) {
            if (selected[i] && selected[i] === state.questions[i].answer) score += 1;
        }

        const percentage = state.questions.length ? Math.round((score / state.questions.length) * 100) : 0;
        const scoreText = `You got ${score}/${state.questions.length} correct (${percentage}%).`;

        // Popup elements
        const popup = document.getElementById('result-popup');
        const popupScore = document.getElementById('popup-score');
        const popupDetails = document.getElementById('popup-details');

        popupScore.textContent = scoreText;

        let explanation = 'Answers:\n';
        state.questions.forEach((q, idx) => {
            explanation += `${idx + 1}. ${q.answer} ${selected[idx] === q.answer ? '✔' : '✖ (you chose: ' + (selected[idx] || 'none') + ')'}\n`;
        });

        popupDetails.textContent = explanation;

        quizResult.classList.add('hidden');
        popup.classList.remove('popup-hidden');

        const closePopup = () => {
            popup.classList.add('popup-hidden');
        };
        document.getElementById('popup-close').onclick = closePopup;
        document.getElementById('popup-ok').onclick = closePopup;

        const escHandler = (event) => {
            if (event.key === 'Escape') {
                closePopup();
                document.removeEventListener('keydown', escHandler);
            }
        };
        document.addEventListener('keydown', escHandler);
    }

    function loadQuiz(subject, grade) {
        state.subject = normalizeKey(subject);
        state.grade = normalizeKey(grade);
        const key = state.subject;
        const gradeKey = state.grade;

        pageTitle.textContent = `Quiz - ${capitalizeWords(state.subject)} Grade ${state.grade}`;
        subtitle.textContent = `Subject: ${capitalizeWords(state.subject)} | Grade: ${state.grade}`;

        fetch('quizzes.json')
            .then(res => { if (!res.ok) throw new Error('quizzes file not found'); return res.json(); })
            .then(data => {
                const subjectData = data[key];
                if (!subjectData) {
                    state.questions = [];
                } else {
                    state.questions = Array.isArray(subjectData[gradeKey]) ? subjectData[gradeKey] : [];
                }
                renderQuestionList();
            })
            .catch(err => {
                console.error('Could not load quizzes.json', err);
                state.questions = [];
                renderQuestionList();
            });
    }

    document.getElementById('start-quiz-btn').addEventListener('click', () => {
        const subject = normalizeKey(subjectSelect.value);
        const grade = normalizeKey(gradeSelect.value);
        if (!subject || !grade) {
            alert('Please choose both subject and grade');
            return;
        }
        const newUrl = `quiz.html?subject=${encodeURIComponent(subject)}&grade=${encodeURIComponent(grade)}`;
        window.history.replaceState({}, '', newUrl);
        loadQuiz(subject, grade);
    });

    setSelectionFromParams();
    </script>
</body>
</html>

    <script type="module">
        import { onAuthUpdate, logout, protectRoute } from './backend/auth.js';
        
        // Protect this page
        protectRoute();

        const authContainer = document.querySelector('.log');
        onAuthUpdate((user) => {
            if (user) {
                authContainer.innerHTML = `<button id="logout-btn" class="nav-link">Log out</button>`;
                document.getElementById('logout-btn').addEventListener('click', async () => {
                    await logout();
                    window.location.href = 'index.html';
                });
            }
        });
    </script>

    <script type="module">
        import { onAuthUpdate, logout } from './backend/auth.js';

        const authContainer = document.querySelector('.log');
        const navLinks = document.querySelectorAll('.nav a');

        // Nav protection logic
        const protectedRoutes = ['grades.html', 'subjects.html', 'quiz.html', 'BIT-Students/index.html'];

        onAuthUpdate((user) => {
            if (user) {
                // User is signed in
                authContainer.innerHTML = `<button id="logout-btn" style="background:none; border: 1px solid #21daff; color: #21daff; padding: 5px 15px; border-radius: 20px; cursor: pointer; font-weight: 600;">Log out</button>`;
                document.getElementById('logout-btn').addEventListener('click', async () => {
                    await logout();
                    window.location.reload();
                });
            } else {
                // User is signed out
                authContainer.innerHTML = `<a href="signUp.html">Sign up</a>`;
            }

            // Click handling for navigation
            navLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    const href = link.getAttribute('href');
                    const isProtected = protectedRoutes.some(route => href.includes(route));
                    
                    if (!user && isProtected) {
                        e.preventDefault();
                        alert('Please sign in to access this page.');
                        window.location.href = 'signin.html';
                    }
                });
            });
        });
    </script>
    <script src="app.js"></script>
</body>

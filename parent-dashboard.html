<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Dashboard - LearnNest</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/i.png" type="image/png">
    <style>
        .dashboard-container {
            max-width: 1000px;
            margin: 2rem auto;
            width: 90%;
        }
        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .link-form {
            background: rgba(15, 23, 42, 0.7);
            padding: 1.5rem;
            border-radius: 14px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .link-form input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: white;
        }
        .child-card {
            background: rgba(15, 23, 42, 0.85);
            border-radius: 18px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .child-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }
        .stat-item {
            text-align: center;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }
        .error-list {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(239, 68, 68, 0.05);
            border: 1px solid rgba(239, 68, 68, 0.1);
            border-radius: 12px;
        }
        .error-item {
            padding: 0.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .error-item:last-child { border-bottom: none; }
        .badge-red { background: #f87171; color: #7f1d1d; padding: 2px 8px; border-radius: 4px; font-weight: bold; margin-right: 5px; }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html">Home</a>
        <a href="grades.html">Grades</a>
        <a href="subjects.html">Subjects</a>
        <a href="quiz.html">Quizzes</a>
        <a href="profile.html">Profile</a>
        <a href="parent-dashboard.html" class="active">Parent Control</a>
        <a href="BIT-Students/index.html">Tasks</a>
        <a href="about.html">About</a>
    </nav>

    <div class="log">
       <a href="#" id="logout-link">Log out</a>
    </div>

    <main class="dashboard-container">
        <div class="header-box">
            <h1 class="title" style="margin: 0; font-size: 2.5rem; border: none; width: auto; animation: none;">Parent Dashboard</h1>
        </div>

        <section class="link-form">
            <label>Track Child Progress: </label>
            <input type="email" id="child-email" placeholder="Enter Child's Email Address">
            <button class="add-btn" id="track-btn">Track Progress</button>
        </section>

        <div id="results-area">
            <div class="card" style="text-align: center; color: #bae6fd;">
                Enter your child's email above to see their progress report.
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2025 LearnNest. All rights reserved.</p>
    </footer>

    <script type="module">
        import { onAuthUpdate, logout, protectRoute, getResultsByEmail } from './backend/auth.js';
        
        protectRoute();

        const trackBtn = document.getElementById('track-btn');
        const childEmailInput = document.getElementById('child-email');
        const resultsArea = document.getElementById('results-area');

        trackBtn.addEventListener('click', async () => {
            const email = childEmailInput.value.trim();
            if (!email) return alert("Please enter an email");

            resultsArea.innerHTML = '<div class="card" style="text-align:center;">Fetching student data...</div>';

            const results = await getResultsByEmail(email);
            renderChildProgress(email, results);
        });

        function renderChildProgress(email, results) {
            if (results.length === 0) {
                resultsArea.innerHTML = `<div class="card" style="text-align:center; color: #f87171;">No data found for ${email}. Make sure the student has completed at least one quiz.</div>`;
                return;
            }

            const totalQuizzes = results.length;
            let totalScore = 0;
            let totalPossible = 0;
            let errors = [];

            results.forEach(r => {
                totalScore += r.score;
                totalPossible += r.total;
                if (r.errors) errors = [...errors, ...r.errors];
            });

            const avgPercent = Math.round((totalScore / totalPossible) * 100);

            // Group errors by question to find patterns
            const errorCountMap = {};
            errors.forEach(e => {
                errorCountMap[e.question] = (errorCountMap[e.question] || 0) + 1;
            });

            const commonErrors = Object.entries(errorCountMap)
                .sort((a,b) => b[1] - a[1])
                .slice(0, 5); // Top 5 common errors

            let html = `
                <div class="child-card">
                    <div class="child-header">
                        <h2>Report for: ${email}</h2>
                        <span style="color: #38bdf8; font-weight: bold;">Status: Active</span>
                    </div>
                    
                    <div class="stats-row">
                        <div class="stat-item">
                            <h3>Average Score</h3>
                            <p style="font-size: 2rem; color: #38bdf8;">${avgPercent}%</p>
                        </div>
                        <div class="stat-item">
                            <h3>Quizzes Solved</h3>
                            <p style="font-size: 2rem;">${totalQuizzes}</p>
                        </div>
                        <div class="stat-item">
                            <h3>Total Errors</h3>
                            <p style="font-size: 2rem; color: #f87171;">${errors.length}</p>
                        </div>
                    </div>

                    <div class="history-section" style="margin-top: 2rem;">
                        <h3>Quiz History</h3>
                        <table style="width: 100%; border-collapse: collapse; margin-top: 1rem;">
                            <thead style="text-align: left; color: #38bdf8;">
                                <tr><th>Subject</th><th>Score</th><th>Date</th></tr>
                            </thead>
                            <tbody>
                                ${results.slice(0,5).map(r => `
                                    <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                                        <td style="padding: 10px; text-transform: capitalize;">${r.subject.replace(/-/g, ' ')}</td>
                                        <td style="padding: 10px;">${r.score}/${r.total}</td>
                                        <td style="padding: 10px;">${r.timestamp ? new Date(r.timestamp.seconds * 1000).toLocaleDateString() : 'Just now'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>

                    ${commonErrors.length > 0 ? `
                        <div class="error-list">
                            <h3>🚨 Critical Gaps (Weak Points)</h3>
                            <p style="font-size: 0.9rem; margin-bottom: 1rem; color: #bae6fd;">Your child struggle with these specific questions repeatedly:</p>
                            ${commonErrors.map(([question, count]) => `
                                <div class="error-item">
                                    <span class="badge-red">${count} missed</span> ${question}
                                </div>
                            `).join('')}
                        </div>
                    ` : '<p style="margin-top: 2rem; color: #4ade80;">No significant knowledge gaps detected! Great job!</p>'}
                </div>
            `;

            resultsArea.innerHTML = html;
        }

        document.getElementById('logout-link').addEventListener('click', async (e) => {
            e.preventDefault();
            await logout();
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
